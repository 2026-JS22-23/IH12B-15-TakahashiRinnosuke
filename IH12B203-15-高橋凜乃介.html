<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地元評価課題</title>
    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCAKLjisxFelKwIl1_G6MiEO9-ya7Twr5s&callback=console.debug&libraries=maps,marker&v=beta">
    </script>
    <style>

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
        }

        div#map {
            width: 100%;
            height: 100%;
        }

        div#arrows{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .arrow{
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px black solid;
            border-radius: 8px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* インフォウィンドウ */
        h1 {
            margin: 0 0 20px 20px;
            font-size: 2.5rem;
        }

        img {
            margin: 0 auto;
            display: block;
            object-fit: cover;
        }
        img.gihujo {
            width: 400px;
            height: 400px;
            object-position: 50% 10%;
        }
        img.shirakawago {
            width: 400px;
            height: 300px;
            object-position: 20% 40%;
        }
        img.gero {
            width: 400px;
            height: 300px;
            object-fit: contain;
        }
        img.seki {
            width: 400px;
            height: 300px;
            object-fit: contain;
        }
        img.tanigumi {
            width: 400px;
            height: 300px;
            object-fit: contain;
        }
        img.bokka {
            width: 400px;
            height: 300px;
            object-fit: contain;
        }

        div#des {
            margin: 20px;
            font-size: 1.2rem;
            line-height: 1.7;
        }

    </style>
</head>
<body>

    <div id="map"></div>
    <div id="arrows"></div>

    <script>

        function mapping(){

            const map = new google.maps.Map(document.getElementById("map"), {
                zoom: 15,
                center: { lat: 35.43398356265202, lng:136.7819908337389 },
                zoomControl: true,
                mapTypeControl: true,
                streetViewControl: false
            });

            var spots = [
                {
                    name: "岐阜城",
                    className: "gihujo",
                    lat: 35.43398356265202,
                    lng: 136.7819908337389,
                    image: "images/gihujo.jpg",
                    des: "岐阜城は金華山の山頂に建つ、岐阜を代表する歴史的な観光名所です。戦国時代には斎藤道三や織田信長の居城として知られ、信長が天下統一を目指す拠点の一つとなりました。現在の天守からは濃尾平野を一望できます。"
                },
                {
                    name: "白川郷",
                    className: "shirakawago",
                    lat: 36.25801298341096,
                    lng: 136.90622968650734,
                    image: "images/shirakawago.jpg",
                    des: "白川郷は、合掌造りの集落が残る岐阜県を代表する観光地です。急な傾斜の茅葺き屋根を持つ合掌造りの家屋が集まり、昔ながらの日本の暮らしを感じられます。季節によって景色が大きく変わり、四季それぞれの魅力を楽しめます。"
                },
                {
                    name: "下呂温泉",
                    className: "gero",
                    lat: 35.80764987236669,
                    lng: 137.240890843604,
                    image: "images/gero.jpg",
                    des: "下呂温泉は、岐阜県下呂市にある温泉地で、日本三名泉の一つに数えられています。温泉街には旅館や飲食店、土産店などが集まり、温泉だけでなく街歩きも楽しめます。飛騨川沿いに広がる温泉街を散策しながら、足湯や温泉を楽しめるのも魅力です。"
                },
                {
                    name: "関鍛冶伝承館",
                    className: "seki",
                    lat: 35.48184123729677,
                    lng: 136.91650268427566,
                    image: "images/seki.jpg",
                    des: "関鍛冶伝承館は、岐阜県関市に伝わる鍛冶の歴史と技術を紹介する施設です。館内では関鍛冶の歴史や刀装具などの資料、日本刀などを見学できます。近現代の包丁やハサミ、ナイフ作品も展示されており、関市が「刃物のまち」として発展してきた歴史を知ることができます。"
                },
                {
                    name: "谷汲山 華厳寺",
                    className: "tanigumi",
                    lat: 35.537183,
                    lng: 136.607951,
                    image: "images/tanigumi.jpg",
                    des: "谷汲山華厳寺は、揖斐川町にある天台宗の寺院で、798年に創建されたと伝えられています。西国三十三所の第三十三番札所で、満願霊場として知られ、「谷汲さん」の名前で親しまれています。境内や参道では四季の自然を楽しめ、特に桜や紅葉の名所としても知られています。"
                },
                {
                    name: "牧歌の里",
                    className: "bokka",
                    lat: 35.98347368982136,
                    lng: 136.92524999605945,
                    image: "images/bokka.jpg",
                    des: "牧歌の里は、岐阜県郡上市のひるがの高原にある、自然や動物と触れ合える観光施設です。広々とした高原の中で季節の花々を楽しめるほか、動物とのふれあいや体験なども楽しめます。四季によって園内の景色が変わるため、季節ごとに異なる雰囲気を味わえるのが特徴です。"
                }
            ];

            const infoWindow = new google.maps.InfoWindow({
            });

            var markers = [];

            spots.forEach(function(spot, index) {
                var marker = new google.maps.Marker({
                    position: { lat: spot.lat, lng: spot.lng },
                    map: map, title: spot.name
                });
                markers.push(marker);

                marker.addListener("click", ()=> {
                    infoWindow.setContent(
                        "<h1>" + spots[index].name + "</h1><br>" +
                        "<img class='" + spots[index].className + "' src ='" + spots[index].image + "'/> " +
                        "<div id='des'>" + spots[index].des + "</div>"
                    );
                    infoWindow.open(map, marker);
                });
            });

            function showArrows() {

                const bounds = map.getBounds();
                const arrowBox = document.getElementById("arrows");

                arrowBox.innerHTML = "";

                

                var north = bounds.getNorthEast().lat();
                var south = bounds.getSouthWest().lat();
                var east = bounds.getNorthEast().lng();
                var west = bounds.getSouthWest().lng();



                var northEastCount = 0;
                var northWestCount = 0;
                var southEastCount = 0;
                var southWestCount = 0;



                spots.forEach(function(spot, index) {

                    if (bounds.contains(new google.maps.LatLng(spot.lat, spot.lng))) {
                        // 画面内なので何もしない
                    } else {

                        var arrow = document.createElement("div");
                        arrow.className = "arrow";

                        // 画面外スポットがどこにあるかの判定
                        if (spots[index].lng > east) {
                            //　東→
                            if (spots[index].lat > north) {
                                //　北↑
                                arrow.textContent = "↗ " + spots[index].name;
                                arrow.style.top = (20 + northEastCount * 60) + "px";
                                northEastCount++;
                                arrow.style.right = "20px";
                            } else if (spots[index].lat < south) {
                                //　南↓
                                arrow.textContent = "↘ " + spots[index].name;
                                arrow.style.bottom = (20 + southEastCount * 60) + "px";
                                southEastCount++;
                                arrow.style.right = "20px";
                            } else {
                                arrow.textContent = "→ " + spots[index].name;
                                arrow.style.top = "50%";
                                arrow.style.right = "20px";
                            }
                        } else if (spots[index].lng < west) {
                            //　西←
                            if (spots[index].lat > north) {
                                //　北↑
                                arrow.textContent = "↖ " + spots[index].name;
                                arrow.style.top = (20 + northWestCount * 60) + "px";
                                northWestCount++;
                                arrow.style.left = "20px";
                            } else if (spots[index].lat < south) {
                                //　南↓
                                arrow.textContent = "↙ " + spots[index].name;
                                arrow.style.bottom = (20 + southWestCount * 60) + "px";
                                southWestCount++;
                                arrow.style.left = "20px";
                            } else {
                                arrow.textContent = "← " + spots[index].name;
                                arrow.style.top = "50%";
                                arrow.style.left = "20px";
                            }
                        } else if (spots[index].lat > north) {
                            //　北↑
                            arrow.textContent = "↑ " + spots[index].name;
                            arrow.style.top = "20px";
                            arrow.style.left = "50%";
                        } else if (spots[index].lat < south) {
                            //　南↓
                            arrow.textContent = "↓ " + spots[index].name;
                            arrow.style.bottom = "20px";
                            arrow.style.left = "50%";
                        }

                        arrow.addEventListener("click", function() {
                            map.panTo({ lat: spot.lat, lng: spot.lng });
                            google.maps.event.trigger(markers[index], "click");
                        });

                        arrowBox.appendChild(arrow);
                    }

                });
            }

            map.addListener("idle", showArrows);

        }

        window.mapping = mapping;
        window.addEventListener("load", ()=> {
            mapping();
        });

    </script>

</body>
</html>
